name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: .
      test-packages: ./...
      web-dir: site
      # build 脚本用系统 zstd 给产物打 .zst 预压缩，找不到 zstd 时它静默跳过 ——
      # 于是镜像里没有压缩资源也不会报错。这里先断言它在（ubuntu-26.04 预装）。
      web-build-command: |
        command -v zstd >/dev/null || { echo '::error::缺系统 zstd，无法生成 .zst 预压缩'; exit 1; }
        pnpm run build
      # 前端产物经 go:embed 打进二进制（internal/static/build）
      frontend-stage-command: |
        mkdir -p internal/static/build
        cp -r site/build/. internal/static/build/

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      binary-name: diarum
      image-name: ghcr.io/felix2yu/diarum
      web-dir: site
      # build 脚本用系统 zstd 给产物打 .zst 预压缩，找不到 zstd 时它静默跳过 ——
      # 于是镜像里没有压缩资源也不会报错。这里先断言它在（ubuntu-26.04 预装）。
      web-build-command: |
        command -v zstd >/dev/null || { echo '::error::缺系统 zstd，无法生成 .zst 预压缩'; exit 1; }
        pnpm run build
      frontend-stage-command: |
        mkdir -p internal/static/build
        cp -r site/build/. internal/static/build/

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      binary-name: diarum
      web-dir: site
      # build 脚本用系统 zstd 给产物打 .zst 预压缩，找不到 zstd 时它静默跳过 ——
      # 于是镜像里没有压缩资源也不会报错。这里先断言它在（ubuntu-26.04 预装）。
      web-build-command: |
        command -v zstd >/dev/null || { echo '::error::缺系统 zstd，无法生成 .zst 预压缩'; exit 1; }
        pnpm run build
      # 本仓库的版本变量是导出的 Version，不是默认的 version
      version-var: main.Version
      frontend-stage-command: |
        mkdir -p internal/static/build
        cp -r site/build/. internal/static/build/
