name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: .
      test-packages: ./...
      web-dir: site
      # site/ 下同时有 bun.lock 与 package-lock.json；CI 走 npm，
      # 不指定会让自动识别选中 bun，而 setup-node 不支持 bun 缓存
      package-manager: npm
      web-install-flags: --legacy-peer-deps
      # 前端产物经 go:embed 打进二进制（internal/static/build）
      frontend-stage-command: |
        mkdir -p internal/static/build
        cp -r site/build/. internal/static/build/

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      binary-name: diarum
      image-name: ghcr.io/felix2yu/diarum
      web-dir: site
      # site/ 下同时有 bun.lock 与 package-lock.json；CI 走 npm，
      # 不指定会让自动识别选中 bun，而 setup-node 不支持 bun 缓存
      package-manager: npm
      web-install-flags: --legacy-peer-deps
      frontend-stage-command: |
        mkdir -p internal/static/build
        cp -r site/build/. internal/static/build/

  release:
    if: github.event_name == 'release'
    permissions:
      contents: write
    uses: Felix2yu/.github/.github/workflows/reusable-release.yml@v1
    with:
      go-dir: .
      binary-name: diarum
      web-dir: site
      # site/ 下同时有 bun.lock 与 package-lock.json；CI 走 npm，
      # 不指定会让自动识别选中 bun，而 setup-node 不支持 bun 缓存
      package-manager: npm
      web-install-flags: --legacy-peer-deps
      # 本仓库的版本变量是导出的 Version，不是默认的 version
      version-var: main.Version
      frontend-stage-command: |
        mkdir -p internal/static/build
        cp -r site/build/. internal/static/build/
