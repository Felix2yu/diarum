name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum

      # 前端产物与架构无关，但会通过 go:embed 打进二进制，
      # 因此每个架构都需要先构建前端再编译后端。
      - name: Build frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --loglevel=error
          npm run build
        working-directory: site

      - name: Copy frontend build to embed location
        run: |
          mkdir -p internal/static/build
          cp -r site/build/* internal/static/build/

      - name: Build backend
        run: |
          VERSION=$(git describe --dirty --always --tags --abbrev=7 2>/dev/null || echo "dev")
          echo "Building version: $VERSION"
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o diarum .

      # 上传该架构的预编译二进制（已内嵌前端），Docker job 直接下载拼装镜像，
      # 不再在镜像内编译。
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: diarum-${{ matrix.label }}
          path: diarum
          retention-days: 7

  docker:
    runs-on: ${{ matrix.runner }}
    needs: build
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'release'

    permissions:
      contents: read
      packages: write
      actions: read

    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest,    label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, label: arm64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 下载预编译二进制（前端已嵌入），Docker 构建只做最终拼装 ——
      # 无 Node 工具链、无 Go 编译。
      - name: Download prebuilt binary
        uses: actions/download-artifact@v8
        with:
          name: diarum-${{ matrix.label }}
          path: bin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ matrix.label }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,scope=${{ matrix.label }},mode=max

  docker-manifest:
    runs-on: ubuntu-latest
    needs: docker
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # push 到 main -> latest + sha；release -> semver + latest
      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ghcr.io/${{ steps.repo.outputs.name }}:amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:arm64
